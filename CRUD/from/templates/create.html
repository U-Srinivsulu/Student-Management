<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add Student</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
}

.form-box {
    background: white;
    width: 320px;
    padding: 30px;
    border-radius: 10px;
    animation: fadeIn 1s ease;
    box-shadow: 0 0 25px rgba(0,0,0,0.15);
}

.form-box h2 {
    text-align: center;
    margin-bottom: 20px;
}

.form-box input {
    width: 100%;
    padding: 10px;
    border-radius: 5px;
    outline: none;
    border: 1px solid #ccc;
    margin-bottom: 15px;
    transition: 0.3s;
}

.form-box input:focus {
    border-color: #667eea;
    box-shadow: 0 0 6px #667eea;
}

.form-box button {
    width: 100%;
    padding: 12px;
    background: #667eea;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.form-box button:hover {
    background: #5a67d8;
    transform: scale(1.05);
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>

</head>
<body>

<div class="form-box">
  <h2>Add Student</h2>

  <form method="POST">
    {% csrf_token %}
    <input type="text" name="name" placeholder="Name" required>
    <input type="number" name="age" placeholder="Age" required>
    <input type="email" name="email" placeholder="Email" required>

    <button type="submit">Save</button>
  </form>
</div>

</body>
</html>
