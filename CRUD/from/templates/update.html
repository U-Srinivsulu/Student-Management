{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Student</title>

    <style>
        :root {
            --bg-gradient-1: #4f46e5;
            --bg-gradient-2: #22c55e;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #6366f1;
            --accent-soft: rgba(99, 102, 241, 0.12);
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top left, var(--bg-gradient-1), #020617 40%),
                        radial-gradient(circle at bottom right, var(--bg-gradient-2), #020617 40%);
            background-size: 200% 200%;
            animation: bgMove 12s ease-in-out infinite alternate;
            color: var(--text-main);
        }

        @keyframes bgMove {
            0% {
                background-position: 0% 0%, 100% 100%;
            }
            100% {
                background-position: 100% 100%, 0% 0%;
            }
        }

        .card-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 1.5rem;
        }

        .card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.92), rgba(248, 250, 252, 0.98));
            border-radius: 1.5rem;
            padding: 2rem 2.2rem;
            box-shadow:
                0 20px 45px rgba(15, 23, 42, 0.35),
                0 0 0 1px rgba(148, 163, 184, 0.25);
            backdrop-filter: blur(16px);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.7s ease-out;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: -40%;
            background:
                radial-gradient(circle at top left, rgba(129, 140, 248, 0.18), transparent 60%),
                radial-gradient(circle at bottom right, rgba(52, 211, 153, 0.16), transparent 60%);
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.6s ease-out;
            pointer-events: none;
        }

        .card:hover::before {
            opacity: 1;
            transform: scale(1);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .header {
            margin-bottom: 1.5rem;
        }

        .title-row {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            margin-bottom: 0.25rem;
        }

        .pill {
            width: 32px;
            height: 32px;
            border-radius: 999px;
            background: conic-gradient(from 180deg, var(--bg-gradient-1), var(--bg-gradient-2), var(--bg-gradient-1));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.45);
            animation: rotatePill 7s linear infinite;
        }

        .pill span {
            font-size: 0.8rem;
            font-weight: 700;
            color: #f8fafc;
        }

        @keyframes rotatePill {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 {
            font-size: 1.4rem;
            letter-spacing: 0.02em;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        form {
            margin-top: 1.2rem;
        }

        .field {
            margin-bottom: 1rem;
        }

        .field label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
            color: #0f172a;
        }

        .field input,
        .field select,
        .field textarea {
            width: 100%;
            padding: 0.6rem 0.8rem;
            border-radius: 0.75rem;
            border: 1px solid #cbd5f5;
            background: #f8fafc;
            font-size: 0.92rem;
            outline: none;
            transition: all 0.2s ease-out;
        }

        .field input:focus,
        .field select:focus,
        .field textarea:focus {
            border-color: var(--accent);
            background: #ffffff;
            box-shadow: 0 0 0 1px var(--accent-soft), 0 0 0 4px rgba(129, 140, 248, 0.20);
            transform: translateY(-1px);
        }

        /* Let Django's {{ form.as_p }} look good */
        form p {
            margin-bottom: 0.85rem;
        }

        form p label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            color: #0f172a;
        }

        form p input,
        form p select,
        form p textarea {
            width: 100%;
            padding: 0.6rem 0.8rem;
            border-radius: 0.75rem;
            border: 1px solid #cbd5f5;
            background: #f8fafc;
            font-size: 0.92rem;
            outline: none;
            transition: all 0.2s ease-out;
        }

        form p input:focus,
        form p select:focus,
        form p textarea:focus {
            border-color: var(--accent);
            background: #ffffff;
            box-shadow: 0 0 0 1px var(--accent-soft), 0 0 0 4px rgba(129, 140, 248, 0.20);
            transform: translateY(-1px);
        }

        .actions {
            margin-top: 1.3rem;
            display: flex;
            gap: 0.75rem;
            align-items: center;
            justify-content: space-between;
        }

        .btn-primary {
            border: none;
            outline: none;
            padding: 0.55rem 1.4rem;
            border-radius: 999px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #4f46e5, #22c55e);
            color: #f9fafb;
            box-shadow:
                0 10px 22px rgba(79, 70, 229, 0.5),
                0 0 0 1px rgba(15, 23, 42, 0.25);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: transform 0.18s ease-out, box-shadow 0.18s ease-out, filter 0.18s ease-out;
        }

        .btn-primary:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow:
                0 16px 30px rgba(79, 70, 229, 0.6),
                0 0 0 1px rgba(15, 23, 42, 0.3);
            filter: brightness(1.05);
        }

        .btn-primary:active {
            transform: translateY(0) scale(0.99);
            box-shadow:
                0 8px 16px rgba(15, 23, 42, 0.45),
                0 0 0 1px rgba(15, 23, 42, 0.35);
        }

        .btn-secondary {
            border: none;
            background: transparent;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-decoration: underline;
            cursor: pointer;
            padding: 0;
        }

        .meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.4rem;
        }

        @media (max-width: 480px) {
            .card {
                padding: 1.6rem 1.4rem;
                border-radius: 1.2rem;
            }
        }
    </style>
</head>
<body>

<div class="card-wrapper">
    <div class="card">
        <div class="header">
            <div class="title-row">
                <div class="pill">
                    <span>U</span>
                </div>
                <h2>Update Student</h2>
            </div>
            <p class="subtitle">Edit the student details below and click update to save changes.</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="actions">
                <button type="submit" class="btn-primary">
                    ⟳ Update
                </button>

                <a href="{% url 'read' %}" class="btn-secondary">
                    ← Back to list
                </a>
            </div>

            <p class="meta">All changes are saved securely in the database.</p>
        </form>
    </div>
</div>

</body>
</html>
